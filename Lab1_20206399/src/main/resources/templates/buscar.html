<meta charset="UTF-8">

<title>Buscar Equipo</title>

<style>

    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f4f4f4;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
    }

    input {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
    }

    button {
        margin-top: 15px;
        padding: 10px;
        width: 100%;
    }

    .resultado {
        margin-top: 30px;
    }

    .error {
        margin-top: 20px;
        padding: 10px;
        background-color: #f8d7da;
    }

</style>

<body>
<h1>Buscar Equipo</h1>

<form id="formBusqueda">

    <label>
        Código de activo:
    </label>

    <input type="text"
           id="codigoActivo"
           required>

    <button type="submit">
        Buscar
    </button>

</form>
<!-- RESULTADO -->
<div class="resultado"
     th:if="${equipo}">

    <h2>Equipo encontrado</h2>

    <p>
        <strong>Nombre:</strong>
        <span th:text="${equipo.nombre}"></span>
    </p>

    <p>
        <strong>Tipo:</strong>
        <span th:text="${equipo.tipo}"></span>
    </p>

    <p>
        <strong>Código de activo:</strong>
        <span th:text="${equipo.codigoActivo}"></span>
    </p>

    <p>
        <strong>Fecha de adquisición:</strong>
        <span th:text="${equipo.fechaAdquisicion}"></span>
    </p>

</div>


<!-- MENSAJE DE ERROR -->

<div class="error"
     th:if="${mensaje}"
     th:text="${mensaje}">
</div>


<br>

<a th:href="@{/equipos}">
    Ver todos los equipos
</a>

<br><br>

<a th:href="@{/equipos/nuevo}">
    Registrar equipo
</a>
</body>
